name: ai-audio-env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # --- Core System & Math (Conda handled) ---
  - numpy<2.0.0
  - pandas<2.0
  - matplotlib
  - seaborn
  - scipy>=1.10.0
  - ffmpeg

  # --- PyTorch Stack (Default: CUDA 12.1) ---
  # If using Mac/CPU, remove 'pytorch-cuda' and the 'nvidia' channel
  - pytorch>=2.0.0
  - torchaudio>=2.0.0
  - pytorch-cuda=12.1

  - pip:
    - pyttsx3>=2.90
    - soundfile>=0.12.1
    # --- Core AI & Whisper ---
    - openai-whisper>=20231117
    - transformers>=4.35.0
    - tokenizers>=0.15.0
    - sentence-transformers>=2.2.2

    # --- LLM & LangChain ---
    - ollama>=0.6.1
    - langchain>=0.1.0
    - langchain-community>=0.0.10
    - chromadb>=0.4.22

    # --- Audio & TTS ---
    - TTS>=0.22.0
    - sounddevice>=0.4.6
    - librosa>=0.10.0
    - webrtcvad>=2.0.10
    - pydub>=0.25.1
    - pyaudio>=0.2.13
    - numba>=0.57.0

    # --- API & Web ---
    - fastapi>=0.108.0
    - uvicorn>=0.25.0
    - h11>=0.16.0
    - httpcore>=1.0.9
    - httpx>=0.28.1
    - anyio>=4.12.0

    # --- Parsing & Utils ---
    - pydantic>=2.12.5
    - pydantic-core>=2.41.5
    - pydantic-settings>=2.1.0
    - annotated-types>=0.7.0
    - typing-extensions>=4.15.0
    - python-dotenv>=1.0.0
    - loguru>=0.7.2
    - tqdm>=4.66.0
    - filelock
    - certifi>=2025.11.12
    - idna>=3.11

    # --- Documents ---
    - pypdf>=3.17.0
    - python-docx>=1.1.0
    - beautifulsoup4>=4.12.0
    - lxml>=4.9.0
    - pyyaml>=6.0.1
    - toml>=0.10.2