<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 440" width="1140" height="440">
  <defs>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f8f8f2"/></marker>
    <marker id="pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bd93f9"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50fa7b"/></marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'IBM Plex Sans', Helvetica, Arial, sans-serif; }
    .t { fill: #f8f8f2; font-size: 20px; font-weight: 600; }
    .s { fill: #b9bfd6; font-size: 15px; }
    .l { fill: #8f97bd; font-size: 14px; }
    .msg { fill: #2a2c38; stroke: #6272a4; stroke-width: 1.5; }
    .mt { fill: #f8f8f2; font-size: 15px; }
    .box { fill: #343746; stroke-width: 2; }
    .line { fill: none; stroke-width: 2; }
  </style>

  <!-- message stack -->
  <rect x="15" y="70" width="250" height="280" rx="12" fill="none" stroke="#6272a4" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="t" x="140" y="104" text-anchor="middle">messages</text>
  <rect class="msg" x="35" y="122" width="210" height="40" rx="6"/>
  <text class="mt" x="140" y="148" text-anchor="middle">system prompt</text>
  <rect class="msg" x="35" y="172" width="210" height="40" rx="6"/>
  <text class="mt" x="140" y="198" text-anchor="middle">last 3 Q&amp;A (REPL memory)</text>
  <rect class="msg" x="35" y="222" width="210" height="40" rx="6" style="stroke:#50fa7b"/>
  <text class="mt" x="140" y="248" text-anchor="middle">question</text>
  <rect class="msg" x="35" y="272" width="210" height="58" rx="6" style="stroke:#bd93f9"/>
  <text class="mt" x="140" y="296" text-anchor="middle">+ every tool result</text>
  <text class="mt" x="140" y="318" text-anchor="middle">of this turn</text>
  <path class="line" stroke="#f8f8f2" marker-end="url(#fg)" d="M265,210 H317"/>

  <!-- hop budget -->
  <text class="l" x="460" y="84" text-anchor="middle">hop budget: MAX_HOPS = 10</text>
  <g stroke="#6272a4" stroke-width="2">
    <rect x="320" y="95" width="22" height="22" fill="#bd93f9"/>
    <rect x="348" y="95" width="22" height="22" fill="#bd93f9"/>
    <rect x="376" y="95" width="22" height="22" fill="#bd93f9"/>
    <rect x="404" y="95" width="22" height="22" fill="#bd93f9"/>
    <rect x="432" y="95" width="22" height="22" fill="#343746"/>
    <rect x="460" y="95" width="22" height="22" fill="#343746"/>
    <rect x="488" y="95" width="22" height="22" fill="#343746"/>
    <rect x="516" y="95" width="22" height="22" fill="#343746"/>
    <rect x="544" y="95" width="22" height="22" fill="#343746"/>
    <rect x="572" y="95" width="22" height="22" fill="#343746"/>
  </g>

  <!-- LLM -->
  <rect class="box" x="320" y="150" width="270" height="120" rx="12" stroke="#ffb86c" style="stroke-width:3"/>
  <text class="t" x="455" y="190" text-anchor="middle" style="font-size:22px">qwen3:14b</text>
  <text class="s" x="455" y="216" text-anchor="middle">think = "high" on every call</text>
  <text class="s" x="455" y="240" text-anchor="middle">temperature 0.3</text>

  <!-- dispatch -->
  <path class="line" stroke="#bd93f9" d="M590,190 H700"/>
  <text class="l" x="645" y="180" text-anchor="middle">tool_calls</text>
  <path class="line" stroke="#bd93f9" d="M700,80 V300"/>
  <path class="line" stroke="#bd93f9" marker-end="url(#pu)" d="M700,80 H717"/>
  <path class="line" stroke="#bd93f9" marker-end="url(#pu)" d="M700,190 H717"/>
  <path class="line" stroke="#bd93f9" marker-end="url(#pu)" d="M700,300 H717"/>

  <!-- tools -->
  <rect class="box" x="720" y="40" width="250" height="80" rx="10" stroke="#8be9fd"/>
  <text class="t" x="845" y="73" text-anchor="middle">📚 Wiki tools (3)</text>
  <text class="s" x="845" y="99" text-anchor="middle">search · overview · page search</text>
  <rect class="box" x="720" y="150" width="250" height="80" rx="10" stroke="#50fa7b"/>
  <text class="t" x="845" y="183" text-anchor="middle">🧍 Player tools (10)</text>
  <text class="s" x="845" y="209" text-anchor="middle">find_items · position · deaths …</text>
  <rect class="box" x="720" y="260" width="250" height="80" rx="10" stroke="#bd93f9"/>
  <text class="t" x="845" y="293" text-anchor="middle">🧠 Skills (4)</text>
  <text class="s" x="845" y="319" text-anchor="middle">strategy text, no game I/O</text>

  <!-- results back -->
  <path class="line" stroke="#bd93f9" d="M970,80 H1000 M970,190 H1000 M970,300 H1000"/>
  <path class="line" stroke="#bd93f9" marker-end="url(#pu)" d="M1000,80 V420 H520 V273"/>
  <text class="l" x="760" y="412" text-anchor="middle">result (or "error: …") appended as a tool message</text>
  <text class="l" x="1010" y="230">args filtered</text>
  <text class="l" x="1010" y="248">by signature</text>

  <!-- answer -->
  <rect x="300" y="360" width="160" height="44" rx="22" fill="#2c3b33" stroke="#50fa7b" stroke-width="2"/>
  <text class="t" x="380" y="389" text-anchor="middle" style="font-size:17px">answer</text>
  <path class="line" stroke="#50fa7b" marker-end="url(#gr)" d="M380,270 V357"/>
  <text class="l" x="390" y="306">no tool call</text>
  <text class="l" x="390" y="324">→ done</text>
</svg>
