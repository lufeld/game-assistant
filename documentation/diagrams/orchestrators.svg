<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 440" width="1140" height="440">
  <defs>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f8f8f2"/></marker>
    <marker id="pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bd93f9"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50fa7b"/></marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'IBM Plex Sans', Helvetica, Arial, sans-serif; }
    .h { fill: #ff79c6; font-size: 28px; font-weight: 700; }
    .sub { fill: #b9bfd6; font-size: 16px; }
    .t { fill: #f8f8f2; font-size: 20px; font-weight: 600; }
    .s { fill: #b9bfd6; font-size: 15px; }
    .l { fill: #8f97bd; font-size: 14px; }
    .box { fill: #343746; stroke-width: 2; }
    .pill { fill: #2c3b33; stroke: #50fa7b; stroke-width: 2; }
    .line { fill: none; stroke-width: 2; }
  </style>

  <line x1="570" y1="10" x2="570" y2="430" stroke="#44475a" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- ROUTER -->
  <text class="h" x="272" y="32" text-anchor="middle">Router</text>
  <text class="sub" x="272" y="58" text-anchor="middle">fixed pipeline · qwen3:4b-instruct</text>

  <rect class="pill" x="172" y="78" width="200" height="40" rx="20"/>
  <text class="t" x="272" y="104" text-anchor="middle" style="font-size:17px">question</text>

  <rect class="box" x="122" y="140" width="300" height="62" rx="10" stroke="#ffb86c"/>
  <text class="t" x="272" y="166" text-anchor="middle">Route</text>
  <text class="s" x="272" y="189" text-anchor="middle">LLM call #1 → JSON: what is needed?</text>

  <rect class="box" x="122" y="224" width="300" height="62" rx="10" stroke="#bd93f9"/>
  <text class="t" x="272" y="250" text-anchor="middle">Gather context</text>
  <text class="s" x="272" y="273" text-anchor="middle">plain Python: how to fetch it</text>

  <rect class="box" x="122" y="308" width="300" height="62" rx="10" stroke="#ffb86c"/>
  <text class="t" x="272" y="334" text-anchor="middle">Answer</text>
  <text class="s" x="272" y="357" text-anchor="middle">LLM call #2 → spoken reply</text>

  <rect class="pill" x="172" y="392" width="200" height="40" rx="20"/>
  <text class="t" x="272" y="418" text-anchor="middle" style="font-size:17px">answer</text>

  <path class="line" stroke="#f8f8f2" marker-end="url(#fg)" d="M272,118 V137"/>
  <path class="line" stroke="#f8f8f2" marker-end="url(#fg)" d="M272,202 V221"/>
  <path class="line" stroke="#f8f8f2" marker-end="url(#fg)" d="M272,286 V305"/>
  <path class="line" stroke="#f8f8f2" marker-end="url(#fg)" d="M272,370 V389"/>

  <text class="l" x="440" y="176">always</text>
  <text class="l" x="440" y="194">2 LLM calls</text>
  <path class="line" stroke="#8f97bd" d="M432,171 V339" stroke-dasharray="3 4"/>

  <!-- REACT AGENT -->
  <text class="h" x="867" y="32" text-anchor="middle">ReAct agent</text>
  <text class="sub" x="867" y="58" text-anchor="middle">reason → act → observe loop · qwen3:14b</text>

  <rect class="pill" x="655" y="78" width="200" height="40" rx="20"/>
  <text class="t" x="755" y="104" text-anchor="middle" style="font-size:17px">question</text>
  <path class="line" stroke="#f8f8f2" marker-end="url(#fg)" d="M755,118 V167"/>

  <rect class="box" x="640" y="170" width="230" height="80" rx="10" stroke="#ffb86c"/>
  <text class="t" x="755" y="202" text-anchor="middle">LLM</text>
  <text class="s" x="755" y="227" text-anchor="middle">thinks, then picks a tool</text>

  <rect class="box" x="930" y="170" width="190" height="80" rx="10" stroke="#bd93f9"/>
  <text class="t" x="1025" y="202" text-anchor="middle">Tool</text>
  <text class="s" x="1025" y="227" text-anchor="middle">wiki · player · skill</text>

  <path class="line" stroke="#bd93f9" marker-end="url(#pu)" d="M830,170 C830,118 1000,118 1000,167"/>
  <text class="l" x="915" y="118" text-anchor="middle">tool call</text>
  <path class="line" stroke="#bd93f9" marker-end="url(#pu)" d="M1030,250 C1030,305 825,305 825,253"/>
  <text class="l" x="928" y="312" text-anchor="middle">result</text>

  <!-- hop budget: 10 slots -->
  <text class="l" x="980" y="352" text-anchor="middle">hop budget: 10 tool calls</text>
  <g stroke="#6272a4" stroke-width="2">
    <rect x="840" y="364" width="22" height="22" fill="#bd93f9"/>
    <rect x="868" y="364" width="22" height="22" fill="#bd93f9"/>
    <rect x="896" y="364" width="22" height="22" fill="#bd93f9"/>
    <rect x="924" y="364" width="22" height="22" fill="#343746"/>
    <rect x="952" y="364" width="22" height="22" fill="#343746"/>
    <rect x="980" y="364" width="22" height="22" fill="#343746"/>
    <rect x="1008" y="364" width="22" height="22" fill="#343746"/>
    <rect x="1036" y="364" width="22" height="22" fill="#343746"/>
    <rect x="1064" y="364" width="22" height="22" fill="#343746"/>
    <rect x="1092" y="364" width="22" height="22" fill="#343746"/>
  </g>

  <rect class="pill" x="620" y="392" width="200" height="40" rx="20"/>
  <text class="t" x="720" y="418" text-anchor="middle" style="font-size:17px">answer</text>
  <path class="line" stroke="#50fa7b" marker-end="url(#gr)" d="M720,250 V389"/>
  <text class="l" x="730" y="330">no tool call</text>
  <text class="l" x="730" y="348">→ done</text>
</svg>
