<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 420" width="1140" height="420">
  <defs>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f8f8f2"/></marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'IBM Plex Sans', Helvetica, Arial, sans-serif; }
    .n { fill: #ff79c6; font-size: 22px; font-weight: 700; }
    .t { fill: #f8f8f2; font-size: 19px; font-weight: 600; }
    .tm { font-family: 'Cascadia Mono', Consolas, 'IBM Plex Mono', monospace; fill: #f8f8f2; font-size: 17px; font-weight: 600; }
    .s { fill: #b9bfd6; font-size: 15px; }
    .l { fill: #8f97bd; font-size: 14px; }
    .k { font-family: 'Cascadia Mono', Consolas, 'IBM Plex Mono', monospace; fill: #f1fa8c; font-size: 14px; }
    .box { fill: #343746; stroke-width: 2; }
    .line { fill: none; stroke: #f8f8f2; stroke-width: 2; }
  </style>

  <!-- input -->
  <rect x="10" y="185" width="120" height="50" rx="25" fill="#2c3b33" stroke="#50fa7b" stroke-width="2"/>
  <text class="t" x="70" y="216" text-anchor="middle" style="font-size:17px">question</text>
  <path class="line" marker-end="url(#fg)" d="M130,210 H162"/>

  <!-- 1 route -->
  <rect class="box" x="165" y="140" width="210" height="140" rx="10" stroke="#ffb86c"/>
  <text class="n" x="185" y="175">1  Route</text>
  <text class="s" x="185" y="202">LLM call #1</text>
  <text class="s" x="185" y="224">JSON schema enforced</text>
  <text class="s" x="185" y="246">19 few-shot examples</text>
  <text class="s" x="185" y="268">temperature 0.1</text>

  <!-- fork -->
  <path class="line" d="M375,210 H400 V90 H427" marker-end="url(#fg)"/>
  <path class="line" d="M400,210 V330 H427" marker-end="url(#fg)"/>
  <text class="k" x="392" y="80" text-anchor="end">entities[]</text>
  <text class="k" x="392" y="320" text-anchor="end">player_info</text>
  <text class="k" x="392" y="340" text-anchor="end">player_target</text>

  <!-- gather area -->
  <rect x="418" y="20" width="460" height="380" rx="14" fill="none" stroke="#bd93f9" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text class="n" x="648" y="196" text-anchor="middle" style="fill:#bd93f9">2  Gather context</text>
  <text class="l" x="648" y="222" text-anchor="middle">plain Python, no LLM involved</text>

  <!-- wiki lane -->
  <rect class="box" x="430" y="50" width="200" height="80" rx="10" stroke="#8be9fd"/>
  <text class="tm" x="530" y="83" text-anchor="middle">ensure_page()</text>
  <text class="s" x="530" y="108" text-anchor="middle">resolve, refresh if stale</text>
  <rect class="box" x="665" y="50" width="200" height="80" rx="10" stroke="#8be9fd"/>
  <text class="tm" x="765" y="83" text-anchor="middle">query_prose()</text>
  <text class="s" x="765" y="108" text-anchor="middle">top-5 chunks of that page</text>
  <path class="line" marker-end="url(#fg)" d="M630,90 H662"/>

  <!-- player lane -->
  <rect class="box" x="430" y="290" width="200" height="80" rx="10" stroke="#50fa7b"/>
  <text class="tm" x="530" y="323" text-anchor="middle">player_db.*</text>
  <text class="s" x="530" y="348" text-anchor="middle">1 of 11 lookups</text>
  <rect class="box" x="665" y="290" width="200" height="80" rx="10" stroke="#50fa7b"/>
  <text class="t" x="765" y="323" text-anchor="middle">one sentence</text>
  <text class="s" x="765" y="348" text-anchor="middle">"northeast, ~40 blocks"</text>
  <path class="line" marker-end="url(#fg)" d="M630,330 H662"/>

  <!-- join -->
  <path class="line" d="M865,90 H885 V210 H907" marker-end="url(#fg)"/>
  <path class="line" d="M865,330 H885 V210"/>

  <!-- 3 answer -->
  <rect class="box" x="910" y="140" width="220" height="140" rx="10" stroke="#ffb86c"/>
  <text class="n" x="930" y="175">3  Answer</text>
  <text class="s" x="930" y="202">LLM call #2</text>
  <text class="s" x="930" y="224">reads only the context</text>
  <text class="s" x="930" y="246">spoken style, temp 0.3</text>
  <text class="s" x="930" y="268">streamed → TTS</text>
</svg>
