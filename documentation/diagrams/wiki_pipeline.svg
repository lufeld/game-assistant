<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 400" width="1140" height="400">
  <defs>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f8f8f2"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50fa7b"/></marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'IBM Plex Sans', Helvetica, Arial, sans-serif; }
    .n { fill: #ff79c6; font-size: 24px; font-weight: 700; }
    .d { fill: #f8f8f2; font-size: 16px; }
    .m { font-family: 'Cascadia Mono', Consolas, 'IBM Plex Mono', monospace; fill: #50fa7b; font-size: 15px; }
    .mo { font-family: 'Cascadia Mono', Consolas, 'IBM Plex Mono', monospace; fill: #f1fa8c; font-size: 15px; }
    .l { fill: #8f97bd; font-size: 14px; }
    .c { font-family: 'Cascadia Mono', Consolas, 'IBM Plex Mono', monospace; fill: #8f97bd; font-size: 13px; }
    .box { fill: #343746; stroke: #bd93f9; stroke-width: 2; }
    .line { fill: none; stroke-width: 2; }
  </style>

  <!-- bypass when the stored copy is current -->
  <path class="line" stroke="#50fa7b" stroke-dasharray="6 5" marker-end="url(#gr)" d="M142,118 V40 H1110"/>
  <text class="l" x="626" y="30" text-anchor="middle" style="fill:#50fa7b">unchanged page → use the stored chunks directly</text>

  <!-- bracket over the expensive part -->
  <path class="line" stroke="#ffb86c" d="M300,100 V88 H1125 V100"/>
  <text class="l" x="712" y="78" text-anchor="middle" style="fill:#ffb86c">only if the page is new or changed   (stored revid ≠ live revid)</text>

  <!-- 1 resolve -->
  <rect class="box" x="15" y="118" width="255" height="190" rx="10"/>
  <text class="n" x="35" y="152">1  Resolve</text>
  <text class="d" x="35" y="182">term → canonical page title</text>
  <text class="d" x="35" y="204">redirects · search fallback</text>
  <text class="mo" x="35" y="248">"diamond swords"</text>
  <text class="m" x="35" y="272">→ Diamond Sword</text>

  <!-- 2 fetch -->
  <rect class="box" x="300" y="118" width="255" height="190" rx="10"/>
  <text class="n" x="320" y="152">2  Fetch</text>
  <text class="d" x="320" y="182">whole page, one API call</text>
  <text class="d" x="320" y="204">once per page revision</text>
  <text class="mo" x="320" y="248">action=parse</text>
  <text class="m" x="320" y="272">→ raw wikitext</text>

  <!-- 3 parse -->
  <rect class="box" x="585" y="118" width="255" height="190" rx="10"/>
  <text class="n" x="605" y="152">3  Parse</text>
  <text class="d" x="605" y="182">wikitext → readable markdown</text>
  <text class="d" x="605" y="204">templates rendered in place</text>
  <text class="mo" x="605" y="248">{{hp|7}} damage</text>
  <text class="m" x="605" y="272">→ 7 damage</text>

  <!-- 4 store -->
  <rect class="box" x="870" y="118" width="255" height="190" rx="10"/>
  <text class="n" x="890" y="152">4  Store</text>
  <text class="d" x="890" y="182">one chunk per section</text>
  <text class="d" x="890" y="204">embedded on CPU (MiniLM)</text>
  <text class="mo" x="890" y="248">Chroma: wiki_prose</text>
  <text class="m" x="890" y="272">SQLite: pages + revid</text>

  <path class="line" stroke="#f8f8f2" marker-end="url(#fg)" d="M270,213 H297"/>
  <path class="line" stroke="#f8f8f2" marker-end="url(#fg)" d="M555,213 H582"/>
  <path class="line" stroke="#f8f8f2" marker-end="url(#fg)" d="M840,213 H867"/>

  <!-- on-disk artefacts -->
  <text class="c" x="142" y="340" text-anchor="middle">wiki_cache/aliases.json</text>
  <text class="c" x="427" y="340" text-anchor="middle">wiki_cache/&lt;page&gt;.json</text>
  <text class="c" x="712" y="340" text-anchor="middle">pure function, no I/O</text>
  <text class="c" x="997" y="340" text-anchor="middle">chroma_db/ · game_db.sqlite3</text>
  <text class="l" x="570" y="382" text-anchor="middle">cheap check on every lookup (prop=info returns the live revid)  ·  expensive work only when something changed</text>
</svg>
